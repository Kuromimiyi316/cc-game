<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>橙澈电竞趣味单计算器工具箱</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #ffffff;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1.25rem;
            color: #1f2a3a;
        }
        .home {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        .home-header { text-align: center; }
        .home-header p { font-size: 0.95rem; color: #6b7a8d; font-weight: 400; }
        .link-list { display: flex; flex-direction: column; gap: 1rem; }
        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            background: #ffffff;
            border: 1.5px solid #e8eef5;
            border-radius: 24px;
            padding: 1.5rem 1.75rem;
            text-decoration: none;
            color: #1f2a3a;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px -8px rgba(31, 42, 58, 0.08);
        }
        .link-card:hover {
            border-color: #b8c9dd;
            background: #fafcff;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -12px rgba(31, 42, 58, 0.15);
        }
        .link-card-left { display: flex; align-items: center; gap: 1rem; min-width: 0; }
        .link-icon {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            flex-shrink: 0;
        }
        .link-icon.blue { background: #eef4ff; border: 1px solid #d6e4f7; }
        .link-icon.gold { background: #fff9e8; border: 1px solid #f5e6b8; }
        .link-text { display: flex; flex-direction: column; gap: 0.25rem; min-width: 0; }
        .link-title { font-size: 1.1rem; font-weight: 650; color: #1f2a3a; letter-spacing: -0.2px; }
        .link-desc { font-size: 0.85rem; color: #7b8a9e; font-weight: 400; }
        .link-arrow { font-size: 1.3rem; color: #b8c6d8; flex-shrink: 0; transition: transform 0.2s, color 0.2s; }
        .link-card:hover .link-arrow { transform: translateX(4px); color: #1f2a3a; }
        .home-footer { text-align: center; font-size: 0.8rem; color: #a0b0c2; margin-top: 1rem; }
        @media (max-width: 480px) {
            body { padding: 2rem 1rem; }
            .link-card { padding: 1.25rem 1.25rem; }
            .link-icon { width: 46px; height: 46px; font-size: 1.4rem; }
            .link-title { font-size: 1rem; }
            .link-desc { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="home">
        <div class="home-header">
            <p>请选择一个工具开始使用</p>
        </div>

        <div class="link-list">
            <a class="link-card" href="./a-calculator/">
                <div class="link-card-left">
                    <div class="link-icon blue">🧮</div>
                    <div class="link-text">
                        <span class="link-title">娱乐玩法计算器</span>
                        <span class="link-desc">多房间 · 连续计算 · 历史回溯</span>
                    </div>
                </div>
                <span class="link-arrow">→</span>
            </a>

            <a class="link-card" href="./b-calculator/">
                <div class="link-card-left">
                    <div class="link-icon gold">💰</div>
                    <div class="link-text">
                        <span class="link-title">亿万富翁 · 保底计算器</span>
                        <span class="link-desc">458R / 888R 档位 · 统一运算</span>
                    </div>
                </div>
                <span class="link-arrow">→</span>
            </a>
        </div>

        <div class="home-footer">© CC Esports  ·  Xiaomi小米</div>
    </div>
</body>
</html>
